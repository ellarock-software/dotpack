kind: mcp-server
dotpack_schema_version: 0
shape_note: |
  Like `hook`, mcp-server is a CONFIG FRAGMENT installed via key-merge into
  the host's MCP config. Unlike hook, the merge target is a top-level map
  keyed by server name (e.g. ".mcpServers.github = {...}"). The schema below
  describes the value-object for a single server entry — i.e. the schema is
  the *contents* of one map entry, not the whole .mcpServers object.

  Counts are per SERVER ENTRY across the corpus (25 entries across 6 files:
  3 Claude `.mcp.json` files contributing 16 entries, 3 Codex `.codex/config.toml`
  files contributing 9 entries). One Codex entry (wp-calypso's chrome-devtools)
  contains nested `tools.<toolname>.approval_mode` sub-entries; those nested
  entries are NOT counted at server-entry granularity — they're sub-floor
  per the methodology choice documented in ecosystem_notes.

template:
  shape: config_fragment
  install_target: map_merge
  source_locations:
    - host: claude-code
      file: .mcp.json
      json_path: $.mcpServers
      alternate_files: ["~/.claude.json"]
      note: |
        DO NOT WRITE TO .claude/settings.json — Claude Code silently
        ignores mcpServers in settings.json (anthropics/claude-code#24477).
        Project scope: .mcp.json at repo root. User scope: ~/.claude.json.
    - host: gemini-cli
      file: .gemini/settings.json
      json_path: $.mcpServers
      alternate_files: ["~/.gemini/settings.json"]
      note: |
        Gemini honours mcpServers in settings.json (unlike Claude). Same
        field shape with documented extensions (httpUrl, headers, cwd,
        timeout, trust) not observed in this corpus.
    - host: codex
      file: ~/.codex/config.toml
      toml_path: mcp_servers
      alternate_files: [".codex/config.toml"]
      note: |
        TOML key is `mcp_servers` (snake_case), not Claude's `mcpServers`
        (camelCase). Both user-scoped (~/.codex/config.toml) and project-
        scoped (.codex/config.toml) are valid. Codex spec defines a
        superset field set (see ecosystem_notes); the schema below covers
        only the cross-host common core. Codex-specific extensions are
        adapter pass-through territory.

server_entry_fields:
  # Discriminated transport: command/args (stdio) XOR url (HTTP).
  - name: command
    type: string
    required: false
    required_when: "stdio transport (url absent)"
    appears_in: 20/25 entries
    notes: |
      Executable that launches the MCP server (e.g. "npx", "uvx", "docker",
      "node", "python", "/Users/.../graphjin"). Always a single binary;
      never a compound shell command. Universal across hosts for the
      stdio transport. Absent on HTTP-transport entries (which use `url`).
  - name: args
    type: array<string>
    required: false
    required_when: "stdio transport (command present)"
    appears_in: 20/25 entries
    notes: |
      Argument list for the stdio executable. Always present when
      `command` is present (even when conceptually empty — corpus has
      no entry with command but no args). The most common first arg is
      "-y" (npx auto-confirm) followed by the package specifier. Per-
      server CLI flags follow. May contain credentials directly when
      env vars aren't used.
  - name: url
    type: string
    required: false
    required_when: "HTTP transport (command absent)"
    appears_in: 5/25 entries
    notes: |
      HTTP endpoint for streamable HTTP / SSE transport. Mutually
      exclusive with `command` — presence of `url` indicates the entry
      is HTTP-transport. All 5 corpus occurrences are in arc-kit
      (Codex), spanning aws-knowledge, microsoft-learn, google-developer-
      knowledge, datacommons-mcp, govreposcrape. Codex spec calls this
      "streamable HTTP server"; Claude's `.mcp.json` corpus uses no `url`
      entries (Claude's stdio-shim pattern via mcp-remote — see notes).
  - name: env
    type: object<string, string>
    required: false
    appears_in: 8/25 entries
    notes: |
      Environment variables passed to the stdio server process. Almost
      exclusively used for secrets (API keys, tokens, hosts) and config
      paths (REGISTRY_URL in plate). Values typically use ${VAR} template
      syntax that the host resolves from the user's environment at startup.
      Empirically, env appears whenever the server requires credentials
      and the author chose env over CLI args. Codex spec extends with
      `env_vars` (allowlist with optional source = local|remote) and
      `bearer_token_env_var` (HTTP transport) — see ecosystem_notes.

ecosystem_notes:
  - "Codex MCP-server schema is a SUPERSET of Claude/Gemini. The full
    Codex spec adds (per developers.openai.com/codex/config-reference):
    cwd, enabled, required, env_vars (with source = local|remote),
    bearer_token_env_var, env_http_headers, http_headers, oauth_resource,
    scopes, startup_timeout_sec (+ _ms alias), tool_timeout_sec,
    default_tools_approval_mode, enabled_tools / disabled_tools (allow/
    deny lists), experimental_environment (local|remote), and per-tool
    overrides via tools.<toolname>.approval_mode. None of these clear the
    universal-schema floor (all <= 1 file in corpus); they are
    adapter pass-through fields for the Codex adapter, NOT promoted to
    the cross-host schema. See ADR-0007 consequences re: per-instance
    lossy promotion when a Codex resource carrying these fields is
    installed via a non-Codex adapter."
  - "`type` field NOT promoted to schema despite 13/25 corpus presence
    (8 'stdio' from ChrisWiles, 5 'http' from arc-kit). Reason: Codex
    spec discriminates transport by PRESENCE of `url` vs `command`, not
    by a `type` field. arc-kit's `type = 'http'` is a Claude-style
    holdover by the author; Codex parser ignores it. Schema uses the
    spec-canonical discriminator (url-vs-command). Translator drops
    `type` on import to Codex; passes through for Claude/Gemini where
    it may still carry meaning."
  - "`headers` vs `http_headers` (arc-kit): arc-kit uses `headers = {...}`
    for API-key injection; Codex spec field is `http_headers`. Either
    arc-kit is wrong (Codex silently ignores `headers`) or `headers` is
    an undocumented alias. Both seen in corpus (2/25). NEITHER promoted
    to schema until the spec/source confirms. Translator canonicalises
    on import: rewrite `headers` to `http_headers` when targeting Codex,
    flag the original spelling in resource metadata for traceability."
  - "Per-tool approval override (wp-calypso): chrome-devtools entry
    contains `tools.click.approval_mode = 'approve'` and
    `tools.evaluate_script.approval_mode = 'approve'`. Counting choice:
    these are SUB-entries of one server entry, not separate server
    entries. At server-entry granularity, 1/25 has the `tools` field —
    below floor. At nested-tool-entry granularity, 2/2 of wp-calypso's
    tools have approval_mode — but the denominator is meaningless
    across the corpus. Schema-wise: not promoted; adapter pass-through.
    Per ADR-0001, may also be a security-agent input (per-tool approval
    is a security control — translator should not silently drop it
    when porting to a host that lacks the concept)."
  - "Filename + key-name divergence: Claude `.mcp.json $.mcpServers`
    (camelCase), Gemini `.gemini/settings.json $.mcpServers` (camelCase),
    Codex `.codex/config.toml mcp_servers` (snake_case). Adapter
    translates the key name on emit; the schema's `template.source_locations`
    declares each canonical location."
  - "Claude footgun: `mcpServers` in `.claude/settings.json` is SILENTLY
    IGNORED by Claude Code (anthropics/claude-code#24477, #646).
    Adapters MUST write to `.mcp.json` or `~/.claude.json`."
  - "Argument-style credential handling varies. abcdan/mcp.json embeds
    secrets directly in args (`--figma-api-key=XXXXXXXX`). arc-kit uses
    `headers={X-API-Key=${...}}` with ${VAR} substitution. Codex spec
    `bearer_token_env_var` is the cleanest pattern (env-var indirection).
    Translator should detect literal secrets in args (high-entropy
    strings) and surface a warning per the security-agent stage (ADR-0001).
    No schema-level enforcement (legitimate args contain high-entropy
    values too — paths, UUIDs, etc.)."
  - "Remote-MCP wrapper detection. abcdan's Atlassian entry is
    structurally `command: npx args: [-y, mcp-remote, https://...sse]` —
    a stdio wrapper around an SSE endpoint. arc-kit's HTTP entries
    express the same concept natively via `url`. Codex spec supports
    both. Translator detecting `mcp-remote` (or similar shims) and
    re-emitting native HTTP form when targeting a host that supports it
    is cleaner than literal-stdio round-tripping. Not v1; documented."
  - "Server name (the JSON/TOML key) is the install identifier. Two
    installs with the same name into the same target file collide —
    manifest must record the server-name claim so a second install
    fails fast rather than silently overwriting."

deliberately_excluded:
  # Per ADR-0016 §8, each deliberately_excluded entry declares a
  # canonical_concept + aliases [{host, field_name}, ...]. Orchestrator's
  # per-instance lossy detection: if a resource's Extensions carry a field
  # listed under aliases[].field_name, install is lossy on hosts NOT in
  # aliases[].host. Entries with aliases: [] are pass-through metadata —
  # never lossy because no host parses them as load-bearing.
  #
  # This block originally lumped 19 host-specific extensions into one
  # entry; split into per-concept entries per ADR-0016 #10 (schema as
  # adapter contract — comprehensive inline documentation required).

  - canonical_concept: transport_type_marker
    aliases: []
    lossy_when_dropped: false       # No host's runtime depends on `type`; dropping is a no-op.
    appeared_in: 13/25 entries
    reason: |
      The `type` field (corpus: 8 "stdio" from ChrisWiles Claude entries,
      5 "http" from arc-kit Codex entries) is NOT a real transport
      discriminator on any host. Codex spec discriminates by presence of
      `url` vs `command`. arc-kit's `type = "http"` is a Claude-style
      holdover the Codex parser ignores. Claude and Gemini accept the
      field but do not parse it semantically (corpus uses it as
      documentation only). Adapter behaviour:
      - All adapters: pass-through if present; never emit if absent.
      - Never lossy (lossy_when_dropped: false) — no host's runtime
        depends on `type`. The validator rejects sources where `type`
        contradicts the transport discriminator (`type: "http"` without
        `url`, or `type: "stdio"` without `command`); see ADR-0014 and
        ADR-0016 §7.

  - canonical_concept: http_transport_headers
    aliases:
      - host: codex
        field_name: http_headers
      - host: codex
        field_name: headers     # arc-kit holdover, possibly Claude-style typo
    appeared_in: 2/25 entries (headers) / 0/25 (http_headers)
    reason: |
      HTTP transport custom headers. Codex spec field is `http_headers`;
      arc-kit (2/25) uses `headers` — either an undocumented alias or
      a typo Codex silently ignores. Both names listed in aliases under
      host: codex because the translator preserves the source spelling
      on import while canonicalising semantically (see
      ecosystem_notes — translator rewrites `headers` → `http_headers`
      when targeting Codex emit). Claude/Gemini have no HTTP-transport
      custom-headers concept in spec (Gemini's `headers` extension is
      undocumented and not corpus-attested). Adapter behaviour:
      - codex adapter: emit as `http_headers` (canonical Codex name).
        If source has `headers`, treat as `http_headers` and warn that
        the spelling was normalised.
      - non-codex adapters: surface as lossy. HTTP authentication is
        load-bearing; silently dropping headers means the install will
        fail at runtime with confusing auth errors.

  - canonical_concept: stdio_working_directory
    aliases:
      - host: codex
        field_name: cwd
      - host: gemini-cli
        field_name: cwd
    appeared_in: 0-1/25 entries
    reason: |
      Working directory for the stdio MCP server process. Same name
      (`cwd`) across both Codex and Gemini specs; same semantics. Claude
      has no documented `cwd` field — stdio servers inherit Claude's
      working directory. Adapter behaviour:
      - codex / gemini-cli adapters: emit natively when present.
      - claude-code adapter: surface as lossy. The MCP server's behaviour
        depends on where it runs (e.g., a server reading config from a
        relative path); silently dropping `cwd` means the server may not
        find its config on Claude. Install proceeds only with
        `--allow-lossy`.

  - canonical_concept: gemini_server_overall_timeout
    aliases:
      - host: gemini-cli
        field_name: timeout
    appeared_in: 0/25 entries
    reason: |
      Gemini-spec field for an overall server timeout (no corpus
      presence). Distinct from Codex's per-phase timeouts
      (startup_timeout_sec, tool_timeout_sec) — those are separate
      canonical_concepts. Adapter behaviour:
      - gemini-cli adapter: emit natively when present.
      - non-gemini adapters: surface as lossy. Adapter ergonomics note:
        if a future ADR-0017 unifies overall-vs-phase timeouts into one
        canonical_concept, this entry merges with codex_startup_timeout
        and codex_tool_call_timeout. Deferred per ADR-0016 (Scenario B).

  - canonical_concept: gemini_server_trust
    aliases:
      - host: gemini-cli
        field_name: trust
    appeared_in: 0/25 entries
    reason: |
      Gemini-spec field for marking a server as "trusted" (no corpus
      presence). Encodes a security control — trusted servers bypass
      certain approval prompts. Adapter behaviour:
      - gemini-cli adapter: emit natively when present.
      - non-gemini adapters: surface as lossy. Security control —
        silently dropping it means a server an author marked trusted
        on Gemini gets default-untrusted treatment on Claude/Codex,
        which may surprise the user. Install proceeds only with
        `--allow-lossy`.

  - canonical_concept: gemini_http_url_alias
    aliases:
      - host: gemini-cli
        field_name: httpUrl
    canonicalises_to: url           # Same concept as universal `url`; Scenario B per ADR-0016.
    appeared_in: 0/25 entries
    reason: |
      Gemini's documented name for HTTP transport URL. The universal
      core promotes `url` (the Codex spec name, 5/25 corpus presence
      from arc-kit) as the canonical HTTP-URL field. `httpUrl` is the
      SAME CONCEPT under a different name — this is a Scenario B case
      (cross-host concept-equivalence under different names) called
      out in ADR-0016 Consequences as deferred to ADR-0017. The
      `canonicalises_to: url` annotation is the machine-readable anchor
      ADR-0017 will consume.
      For MVP:
      - The translator on Gemini-source import should normalise `httpUrl`
        to the universal `url` field. (Translator concern, not adapter.)
      - If the translator fails to normalise and the canonical resource
        carries `httpUrl` in Extensions, lossy detection per the table
        above flags it as Gemini-only — over-strict for installs on
        Codex (which supports the same concept under name `url`).
        Acceptable until ADR-0017 introduces alias-aware translation.

  - canonical_concept: codex_server_lifecycle
    aliases:
      - host: codex
        field_name: enabled
      - host: codex
        field_name: required
    appeared_in: 0/25 entries
    reason: |
      Codex-spec lifecycle flags: `enabled: false` disables a server
      without removing it from config; `required: true` causes Codex
      to fail startup if the server doesn't initialise (vs default
      warn-and-continue). Adapter behaviour:
      - codex adapter: emit natively when present.
      - non-codex adapters: surface as lossy. `enabled: false` is
        particularly load-bearing — silently emitting the server as
        active on Claude/Gemini contradicts the author's explicit
        intent. Install proceeds only with `--allow-lossy`.

  - canonical_concept: codex_env_vars_with_source
    aliases:
      - host: codex
        field_name: env_vars
    appeared_in: 0/25 entries
    reason: |
      Codex-spec richer environment-variable declaration with
      per-variable `source = local|remote` indirection (vs the
      universal `env` field which is a flat `{name: value}` map).
      Scenario B-adjacent: `env_vars` and the universal `env` overlap
      in concept (env vars for the server process) but `env_vars`
      encodes additional information (variable source). Adapter
      behaviour:
      - codex adapter: emit natively when present.
      - non-codex adapters: surface as lossy. The `source = remote`
        case encodes that a credential lives in Codex's secret store,
        not in the local environment — dropping it means the variable
        is unset at server startup on other hosts, which silently
        breaks auth. Install proceeds only with `--allow-lossy`.

  - canonical_concept: codex_bearer_token_env_var
    aliases:
      - host: codex
        field_name: bearer_token_env_var
    appeared_in: 0/25 entries
    reason: |
      Codex-spec field for HTTP-transport bearer auth: the name of an
      env var whose value Codex injects as `Authorization: Bearer
      ${value}`. Cleanest credential pattern in the corpus (vs
      args-embedded secrets at abcdan or template-interpolated headers
      at arc-kit). Adapter behaviour:
      - codex adapter: emit natively when present.
      - non-codex adapters: surface as lossy. HTTP auth is load-bearing;
        dropping the bearer-token directive means the HTTP server
        rejects all requests with 401. Install proceeds only with
        `--allow-lossy`.

  - canonical_concept: codex_http_auth_metadata
    aliases:
      - host: codex
        field_name: env_http_headers
      - host: codex
        field_name: oauth_resource
      - host: codex
        field_name: scopes
    appeared_in: 0/25 entries
    reason: |
      Codex-spec HTTP-transport auth metadata: `env_http_headers`
      (env-var-interpolated custom headers, vs the literal-values
      http_headers above), `oauth_resource` (OAuth resource identifier),
      `scopes` (OAuth scope list). Adapter behaviour:
      - codex adapter: emit natively when present.
      - non-codex adapters: surface as lossy. OAuth metadata is
        load-bearing; dropping it means token-acquisition fails. Install
        proceeds only with `--allow-lossy`.

  - canonical_concept: codex_startup_timeout
    aliases:
      - host: codex
        field_name: startup_timeout_sec
      - host: codex
        field_name: startup_timeout_ms
    appeared_in: 0/25 entries
    reason: |
      Codex-spec timeout for server startup phase (vs request handling).
      Two unit-suffixed aliases for the same field — Codex spec
      documents both, parser accepts either. Adapter behaviour:
      - codex adapter: emit whichever the source carried; if both
        present, prefer `_sec` per Codex spec precedence. The
        validator warns on conflict.
      - non-codex adapters: surface as lossy. Startup timeout encodes
        an explicit author-chosen wait-budget; silently dropping it
        means the host uses its default (which may be shorter for a
        slow-starting server, causing intermittent install-time
        failures). Install proceeds only with `--allow-lossy`.

  - canonical_concept: codex_tool_call_timeout
    aliases:
      - host: codex
        field_name: tool_timeout_sec
    appeared_in: 0/25 entries
    reason: |
      Codex-spec timeout for individual tool calls (vs startup). Adapter
      behaviour:
      - codex adapter: emit natively when present.
      - non-codex adapters: surface as lossy. Same rationale as
        codex_startup_timeout. Install proceeds only with `--allow-lossy`.

  - canonical_concept: codex_default_tool_approval_mode
    aliases:
      - host: codex
        field_name: default_tools_approval_mode
    appeared_in: 0/25 entries
    reason: |
      Codex-spec server-wide approval default — gates whether tools
      from this server require user approval. Security-relevant.
      Adapter behaviour:
      - codex adapter: emit natively when present.
      - non-codex adapters: surface as lossy. Author explicitly chose
        an approval posture; silently dropping it means tools run
        under the host's default (which may be more permissive),
        bypassing the security control. Install proceeds only with
        `--allow-lossy`.

  - canonical_concept: codex_tool_allowlist
    aliases:
      - host: codex
        field_name: enabled_tools
      - host: codex
        field_name: disabled_tools
    appeared_in: 0/25 entries
    reason: |
      Codex-spec per-server tool allowlist (`enabled_tools`) and
      denylist (`disabled_tools`). Security control. Adapter behaviour:
      - codex adapter: emit natively when present.
      - non-codex adapters: surface as lossy. An author who restricted
        the server's exposed tools via these lists chose explicit
        attack-surface reduction; silently emitting the unrestricted
        server elsewhere exposes more tools than the author intended.
        Install proceeds only with `--allow-lossy`.

  - canonical_concept: codex_experimental_environment
    aliases:
      - host: codex
        field_name: experimental_environment
    appeared_in: 0/25 entries
    reason: |
      Codex-spec `experimental_environment: local|remote` for server
      placement (whether Codex runs the server itself or expects a
      remote executor). Adapter behaviour:
      - codex adapter: emit natively when present.
      - non-codex adapters: surface as lossy. `remote` placement
        means the server runs outside the host's process — emitting
        the entry on Claude/Gemini without the remote-executor
        infrastructure would attempt local launch and fail. Install
        proceeds only with `--allow-lossy`.

  - canonical_concept: per_tool_approval
    aliases:
      - host: codex
        field_name: tools     # nested .approval_mode per tool id
    appeared_in: 1/25 entries (wp-calypso chrome-devtools)
    reason: |
      Codex-spec per-tool approval override (`tools.<id>.approval_mode`).
      A security control — wp-calypso uses it to require user approval
      for chrome-devtools' `click` and `evaluate_script` tools, which
      can perform destructive actions. The alias field_name is `tools`
      (the top-level key); lossy detection sees the resource carrying
      a `tools` extension and consults this concept. Adapter behaviour:
      - codex adapter: emit natively when present.
      - non-codex adapters: surface as lossy. This is the canonical
        example called out in ADR-0007's per-instance lossy addendum
        and ADR-0014 — silently dropping per-tool approval is exactly
        the failure mode dotpack exists to prevent. Install proceeds
        only with `--allow-lossy`. Also a security-agent input per
        ADR-0001.
