kind: skill
dotpack_schema_version: 0
template:
  shape: file_with_frontmatter
  filename: SKILL.md
  body: required  # markdown after frontmatter is the skill's instructions
fields:
  - name: name
    type: string
    required: true
    appears_in: 10/10
    notes: |
      Unique identifier. Letters, numbers, and hyphens only per Gemini CLI spec
      (other ecosystems converge on the same constraint).
  - name: description
    type: string
    required: true
    appears_in: 10/10
    notes: |
      The primary LLM-triggering field. Two common phrasings in the wild:
      "Use when ..." (declarative trigger) and "Use this skill whenever ..."
      (imperative trigger). Both work; dotpack does not normalise. Recommend
      <= 1024 chars (Anthropic convention noted in body of obra/writing-skills
      and anthropic/skill-creator).
  - name: license
    type: string
    required: false
    appears_in: 3/10
    notes: |
      Anthropic-ecosystem convention (present in 3/4 anthropics/skills examples,
      absent everywhere else in the corpus). Free-form pointer to LICENSE.txt or
      a literal SPDX/proprietary string. Pass-through during translation.
ecosystem_notes:
  - SKILL.md is the canonical filename across Claude Code, Gemini CLI,
    Antigravity CLI, Codex CLI, OpenCode, and Hermes. The
    `~/.agents/skills/` alias is honoured by Gemini and Codex; Hermes
    documents `~/.hermes/skills/` as the primary skill root plus
    `skills.external_dirs` in `~/.hermes/config.yaml` for extra search
    paths such as `~/.agents/skills/`. The on-disk package layout
    (folder with SKILL.md + optional scripts/, references/, assets/) is
    identical across these hosts.
  - dotpack copies regular support files under the source skill directory
    (for example `scripts/*`, `references/*`, and `assets/*`) to the same
    relative paths under the target skill directory and records them in the
    manifest. Symlinks are rejected.
  - Source-backed skill packages preserve SKILL.md byte-for-byte per ADR-0004,
    including when --allow-lossy acknowledges fields the target host cannot
    honour. Physical preservation does not make an unsupported field effective
    on that host. Skills synthesized in memory without source bytes are
    re-encoded into the target host's supported shape.
  - Description-as-trigger is universal. The skill's body (everything after
    the closing `---`) is the instruction content the agent loads on trigger.
  - Some skills mention `compatibility` as an optional frontmatter field in
    their body text, but none of the corpus examples actually used it in
    frontmatter. Treated as authorial intent, not schema.
deliberately_excluded:
  # Per ADR-0012 §8, each deliberately_excluded entry declares a
  # canonical_concept slug plus the frontmatter field name(s) that
  # encode it on disk. Two binding mechanisms — pick the one that
  # matches the concept's nature, not both:
  #
  #   aliases: [{host, field_name}, ...]   — for concepts at least one
  #     host natively parses. The per-instance lossy check uses this:
  #     if Extensions carry a field listed in aliases[].field_name and
  #     the target host is NOT in aliases[].host, the install is lossy.
  #
  #   field_names: [name, ...]             — for pass-through metadata
  #     concepts (lossy_when_dropped: false) that no host parses
  #     natively. Lets the schema bind the on-disk key to its concept
  #     without inventing a fake "host". The lossy check matches by
  #     this list and short-circuits on lossy_when_dropped: false.
  #
  # Entries without either binding cannot be matched by the lossy
  # check at all — the field surfaces as "unknown" → lossy by default.

  - canonical_concept: discovery_keywords
    field_names: [keywords]
    aliases: []
    lossy_when_dropped: false       # No host parses; dropping is a no-op.
    appeared_in: 1/10 (daymade/qa-expert only)
    reason: |
      Author convention for skill discoverability (tag-like). No surveyed
      host (Claude Code, Gemini CLI, Codex CLI) parses `keywords` as a
      first-class discovery field — skills are triggered by `description`
      across all three. Below the 2-example floor, and adopting it would
      not change install behaviour anywhere. Adapter behaviour: preserve
      verbatim as pass-through metadata if the source carries it; never
      flag as lossy (lossy_when_dropped: false). If a future host adopts
      native keyword-based discovery, add it to `aliases` and flip
      lossy_when_dropped to true.

  - canonical_concept: metadata_bucket
    field_names: [metadata]
    aliases: []
    lossy_when_dropped: false       # No host parses; dropping is a no-op.
    appeared_in: 1/10 (openai/gh-address-comments only)
    reason: |
      Bucket field for non-standard sub-fields (single-author observed
      `short-description` inside). No host parses it natively. Adapter
      behaviour: pass-through if present; never lossy. If multiple kinds
      eventually need a metadata bucket, promote to a universal optional
      field rather than per-kind extensions.

  - canonical_concept: skill_version_metadata
    field_names: [version]
    aliases: []
    lossy_when_dropped: false
    appeared_in: Hermes docs/examples
    reason: |
      Version metadata carried by Hermes-first skills. Treated as
      pass-through metadata rather than a universal core field because
      no surveyed non-Hermes host parses it semantically. Adapter
      behaviour: preserve verbatim when present; never flag as lossy.

  - canonical_concept: skill_author_metadata
    field_names: [author]
    aliases: []
    lossy_when_dropped: false
    appeared_in: Hermes docs/examples
    reason: |
      Author metadata carried by Hermes-first skills. Same policy as
      `version`: preserve verbatim as pass-through metadata; do not
      treat dropping it as semantically lossy.

  - canonical_concept: artifact_provenance_documentation
    field_names:
      - id
      - artifact-type
      - owner/surface
      - purpose
      - registered-in
      - tests
    aliases: []
    lossy_when_dropped: false       # No host parses; dropping is a no-op.
    appeared_in: 8/90 (ellarock-config corporate skill packages)
    reason: |
      Authoring-side provenance docblock: which artifact this is, who owns
      it, why it exists, where it is registered, and how to test it. No
      surveyed host parses any of these — they are read by humans and by
      repository validation tooling that reads the source tree, not the
      installed copy. Adapter behaviour: preserve verbatim as pass-through
      metadata; never flag as lossy. Source-backed packages keep the bytes
      per ADR-0004 regardless, so the installed SKILL.md still carries the
      docblock for anyone auditing the host tree.

  - canonical_concept: artifact_dataflow_documentation
    field_names:
      - inputs
      - outputs
      - state-read
      - state-written
      - failure-mode
    aliases: []
    lossy_when_dropped: false       # No host parses; dropping is a no-op.
    appeared_in: 8/90 (ellarock-config corporate skill packages)
    reason: |
      Prose description of what the artifact reads, writes, and how it
      fails. Documentation of intent for reviewers; no host reads it and
      no host enforces it. Note this is deliberately NOT treated as
      load-bearing: unlike hermes_skill_required_environment, these fields
      declare no precondition the host could check, so dropping them
      removes no runtime guarantee.

  - canonical_concept: authorial_trigger_hints
    field_names:
      - triggers
      - patterns
    aliases: []
    lossy_when_dropped: false       # No host parses; dropping is a no-op.
    appeared_in: 8/90 and 5/90 (ellarock-config corporate skill packages)
    reason: |
      Author-side restatement of when the skill should fire, sometimes as
      regex-shaped strings. Every surveyed host triggers skills from
      `description` alone (see the description-as-trigger note above), so
      these are commentary on the trigger, not the trigger itself. Same
      policy as discovery_keywords. If a host ever adopts native pattern
      matching, move the field into `aliases` and flip
      lossy_when_dropped to true.

  - canonical_concept: authorial_environment_notes
    field_names:
      - permissions
      - requires
      - compatibility
      - host-compatibility
    aliases: []
    lossy_when_dropped: false       # No host parses; dropping is a no-op.
    appeared_in: 8/90 (ellarock-config corporate skill packages)
    reason: |
      Prose notes on the authority the skill expects, the tools it assumes
      on PATH, and the hosts/platforms it was written for. Distinct from
      claude_skill_runtime_overrides.allowed-tools and from
      hermes_skill_platform_filter: those are machine-parsed by a host and
      change what the host permits or exposes, whereas these are sentences
      for a human reviewer. `permissions` in particular reads like a
      security control but is not one — no host enforces it, and the
      enforcing field on Claude Code is `allowed-tools`. `compatibility`
      is the field the ecosystem_notes above already flag as authorial
      intent rather than schema.

  - canonical_concept: skill_config_schema_version
    field_names: [config-version]
    aliases: []
    lossy_when_dropped: false       # No host parses; dropping is a no-op.
    appeared_in: 1/90 (daily-supervisor)
    reason: |
      Version of the skill's own CONFIG.md contract, consumed by the
      skill's scripts at runtime from the source tree. Not a dotpack or
      host concept; distinct from skill_version_metadata (`version`),
      which versions the skill package itself.

  - canonical_concept: hermes_skill_platform_filter
    aliases:
      - host: hermes
        field_name: platforms
    appeared_in: Hermes docs/examples
    reason: |
      Hermes-native platform gating for skills (`linux`, `macos`,
      `windows`). Load-bearing: Hermes uses it to decide whether a skill
      is available on the current OS. Adapter behaviour:
      - hermes adapter: emit natively when present.
      - non-hermes adapters: surface as lossy. Silently dropping a
        platform filter can make a skill available on hosts/OSes the
        author explicitly excluded.

  - canonical_concept: hermes_skill_required_environment
    aliases:
      - host: hermes
        field_name: required_environment_variables
      - host: hermes
        field_name: required_credential_files
    appeared_in: Hermes docs/examples
    reason: |
      Hermes-native preflight requirements for skills. These fields
      declare environment variables or credential files the skill needs
      before execution. Adapter behaviour:
      - hermes adapter: emit natively when present.
      - non-hermes adapters: surface as lossy. Dropping them removes a
        real runtime precondition check and makes failure mode much less
        clear for the user.

  - canonical_concept: claude_skill_runtime_overrides
    aliases:
      - host: claude-code
        field_name: allowed-tools
      - host: claude-code
        field_name: model
      - host: claude-code
        field_name: context
      - host: claude-code
        field_name: agent
      - host: claude-code
        field_name: argument-hint
      - host: claude-code
        field_name: disable-model-invocation
      - host: claude-code
        field_name: user-invocable
    appeared_in: 0/10
    reason: |
      Documented in the Claude Code SKILL.md spec but absent from every
      corpus example. These are per-tool runtime concerns — tool
      permissions (`allowed-tools`), model selection (`model`), subagent
      dispatch (`context`, `agent`), CLI ergonomics (`argument-hint`),
      invocation control (`disable-model-invocation`, `user-invocable`).
      Grouped into one canonical_concept for now because corpus presence
      is zero across all of them; splitting into per-concept entries
      (claude_skill_tool_permissions, claude_skill_model_override, ...)
      is a follow-up if future corpus surfaces any of them above floor.
      Adapter behaviour:
      - claude-code adapter: emit natively when present.
      - non-claude-code adapters: surface as lossy (the field has runtime
        meaning on Claude that other hosts cannot honour). Install
        proceeds only with `--allow-lossy`. Source-backed skill packages retain
        the original bytes per ADR-0004, but the unsupported host still does
        not honour these fields. Synthesized skills omit unsupported fields.
