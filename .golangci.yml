# golangci-lint configuration for dotpack (schema v2).
#
# Runs the standard linter set (errcheck, govet, ineffassign, staticcheck,
# unused). Local: `golangci-lint run ./...`. CI: the "lint" job in ci.yml.

version: "2"

linters:
  default: standard

  settings:
    errcheck:
      # Conventional writers/cleanup whose error is intentionally discarded.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.RemoveAll
    staticcheck:
      checks:
        - all
        # Preserve golangci-lint's default-disabled ST* stylistic checks
        # (package comments, naming conventions) — noisy on this codebase.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Disable subjective "quickfix" style suggestions (De Morgan's law,
        # tagged switches, WriteString-vs-Fprintf). These are auto-fix style
        # opinions, not correctness issues.
        - -QF1001
        - -QF1003
        - -QF1012

  exclusions:
    rules:
      # Tests routinely ignore errors from Unmarshal/WriteFile/Unsetenv on
      # controlled fixtures; don't gate on that.
      - path: _test\.go
        linters:
          - errcheck
