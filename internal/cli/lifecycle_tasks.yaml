version: 1
tasks:
  - name: sponsio-enforcement
    phase: post-install
    applies_to:
      agents:
        - codex
        - gemini-cli
        - antigravity-cli
        - agents-cli
    ensure:
      binaries:
        - name: sponsio
          env: DOTPACK_SPONSIO_BINARY
          install:
            candidates:
              - command: pip
                args: ["install", "sponsio"]
              - command: pip3
                args: ["install", "sponsio"]
    run:
      - command: sponsio
        args: ["host", "install", "claude-code", "--mode", "enforce"]
    # Explicit host status checks are intentional. Sponsio's current
    # `host install all` expands only registered hosts, so an older binary that
    # lacks codex/gemini-cli/antigravity-cli support must fail closed here
    # instead of silently reporting a successful dotpack materialization.
    verify:
      - command: sponsio
        args: ["host", "status", "claude-code"]
    failure: fail-closed
